name: Release

# Push a tag like v0.1.0 to build the installers and attach them to a draft GitHub
# Release (publish it from the Releases page after checking the notes). Run manually
# (workflow_dispatch) to build the artifacts without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The runner image has Node, CMake and the VS 2022 C++ tools, so nothing is installed.
      - name: Build installer
        shell: pwsh
        run: ./scripts/package/build_windows.ps1 -NoInstall
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: gui/dist/*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build AppImage
        run: |
          npm --prefix gui ci
          npm --prefix gui run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: gui/dist/*.AppImage
          if-no-files-found: error

  # Apple Silicon only. Ad-hoc signed unless the repository has the Developer ID secrets
  # (CSC_LINK = base64 .p12, CSC_KEY_PASSWORD, and for notarization APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID); see docs/packaging_macos.md.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          swift --version
          bash scripts/package/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            gui/dist/*.dmg
            gui/dist/*-mac.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
