[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "what"
version = "0.1.0"
description = "Local live transcription, browser captions, and audio-linked transcript review."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["tomli; python_version < '3.11'"]

[project.optional-dependencies]
client = [
    "websockets",
    "zeroconf",
]
service = [
    "fastapi",
    "faster-whisper",
    "numpy",
    "soundcard; sys_platform == 'win32'",
    "uvicorn",
    "webrtcvad-wheels",
    "websockets",
    "zeroconf",
]
cleanup = [
    "mlx-lm",
]
macos = [
    "fastapi",
    "uvicorn",
    "webrtcvad-wheels",
    "websockets",
    "zeroconf",
]
all = [
    "fastapi",
    "faster-whisper",
    "numpy",
    "soundcard; sys_platform == 'win32'",
    "uvicorn",
    "webrtcvad-wheels",
    "websockets",
    "zeroconf",
]

[project.scripts]
what = "what.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = [
    "what",
    "what.cli",
    "what.client",
    "what.controller",
    "what.service",
    "what.discovery",
    "what.reporting",
    "what.test_runner",
]
